<!-- src/app/pages/cart/cart.component.html -->
<div class="cart-container">
  <h2>Your Shopping Cart</h2>
  
  <ng-container *ngIf="cartItems.length > 0; else emptyCart">
    <table class="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Quantity</th>
          <th>Remove</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of cartItems">
          <td data-label="Product">
            <div class="product-info">
              <img [src]="item.thumbnail" alt="{{ item.title }}" class="product-thumbnail">
              <div>
                <p>{{ item.title }}</p>
                <p class="text-muted">Product Code: {{ item.id }}</p>
              </div>
            </div>
          </td>
          <td data-label="Quantity">
            <div class="quantity-control">
              <button (click)="decrementQuantity(item)">-</button>
              <span>{{ item.quantity }}</span>
              <button (click)="incrementQuantity(item)">+</button>
            </div>
          </td>
          <td data-label="Remove">
            <button class="remove-item-btn" (click)="removeItem(item.id)">×</button>
          </td>
          <td data-label="Price">£{{ item.price * item.quantity }}</td>
        </tr>
      </tbody>
    </table>
    
    <div class="cart-total">
      <p>Total: £{{ totalPrice }}</p>
    </div>
  </ng-container>
  
  <ng-template #emptyCart>
    <div class="empty-cart">
      <p>Your cart is empty. Start shopping now!</p>
    </div>
  </ng-template>
</div>
